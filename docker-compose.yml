version: "3.9"

services:
  # ── MongoDB ─────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: sas_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: sas_db
    networks:
      - sas_network

  # ── Backend (FastAPI) ────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - ./ai:/app/ai
      - ai_models:/app/ai_models
    networks:
      - sas_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend (Vite / React) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sas_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - sas_network

volumes:
  mongo_data:
  mongo_config:
  ai_models:

networks:
  sas_network:
    driver: bridge
